name: 💡 기능 제안 (Feature request)
description: 개선 아이디어를 제안해 주세요
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 풀고 싶나요?
      description: 배경과 사용 맥락을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결책
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
